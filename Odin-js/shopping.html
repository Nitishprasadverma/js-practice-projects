<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
        li {
            margin-bottom: 10px;
        }

        li button {
            font-size: 12px;
            margin-left: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>My shopping list</h1>

    <div>
        <label for="item">Enter a new item:</label>
        <input type="text" name="item" id="item">
        <button>Add item</button>
    </div>

    <ol>

    </ol>

    <script>
        const btn = document.querySelector("button");
        const unOrderList = document.querySelector("ol");
        const search = document.querySelector("input")

        function btnClick() {
            let item = search.value;
            search.value = "";
            const listli = document.createElement("li");
            const listspan = document.createElement("span");
            const listbutton = document.createElement("button");

            listli.appendChild(listspan);
            listli.appendChild(listbutton);
            listspan.textContent = item;
            listbutton.textContent = "Delete";
            unOrderList.appendChild(listli);

            listbutton.addEventListener("click", () => {
                unOrderList.removeChild(listli);
            })

            search.focus();
        }
        btn.addEventListener("click", btnClick)


    </script>
</body>

</html>
